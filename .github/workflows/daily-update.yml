name: Daily NPB Scores Update

on:
  schedule:
    # 10:05 / 16:05 / 22:05 JST. Cloudflare Cron also dispatches this workflow,
    # but GitHub schedule keeps the update running if Worker dispatch stops.
    - cron: '5 1,7,13 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Single JST date (YYYY-MM-DD)'
        required: false
        type: string
      from:
        description: 'Start JST date (YYYY-MM-DD)'
        required: false
        type: string
      to:
        description: 'End JST date (YYYY-MM-DD)'
        required: false
        type: string
      days:
        description: 'Inclusive days ending today JST'
        required: false
        default: '3'
        type: string
      strict:
        description: 'Fail on normal 404 warnings'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Plan date/year targets without DB/network updates'
        required: false
        default: false
        type: boolean

concurrency:
  group: normalized-daily-update
  cancel-in-progress: false

jobs:
  update-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IS_DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
      NPB_D1_DATABASE: npb-archive-chat-normalized
      NPB_D1_DATABASE_ID: eb614de3-eb0c-4816-a7b2-8440e94093a8
      NPB_R2_BUCKET: npb-archive-chat-raw
      NPB_R2_SQLITE_BACKUP_PREFIX: backups/sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Wrangler
        if: ${{ env.IS_DRY_RUN != 'true' }}
        run: npm install -g wrangler@4.83.0

      - name: Install AWS CLI
        if: ${{ env.IS_DRY_RUN != 'true' }}
        run: python -m pip install --user awscli

      - name: Restore SQLite backups from R2
        if: ${{ env.IS_DRY_RUN != 'true' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "CLOUDFLARE_R2_ACCESS_KEY_ID and CLOUDFLARE_R2_SECRET_ACCESS_KEY GitHub secrets are required for R2 backup restore" >&2
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '\r\n ')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '\r\n ')"
          r2_endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir -p data
          for year in $(seq 2016 2026); do
            aws s3 cp "s3://${NPB_R2_BUCKET}/${NPB_R2_SQLITE_BACKUP_PREFIX}/npb-${year}.sqlite" \
              "data/npb-${year}.sqlite" \
              --endpoint-url "$r2_endpoint" \
              --only-show-errors
          done

      - name: Run update:daily
        id: update_daily
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$(printf '%s' "${AWS_ACCESS_KEY_ID:-}" | tr -d '\r\n ')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "${AWS_SECRET_ACCESS_KEY:-}" | tr -d '\r\n ')"
          mkdir -p data/logs
          args=()
          if [ -n "${{ inputs.date }}" ]; then
            args+=(--date "${{ inputs.date }}")
          elif [ -n "${{ inputs.from }}" ] || [ -n "${{ inputs.to }}" ]; then
            args+=(--from "${{ inputs.from }}" --to "${{ inputs.to }}")
          else
            args+=(--days "${{ inputs.days || '3' }}")
          fi
          if [ "${{ inputs.strict || false }}" = "true" ]; then
            args+=(--strict)
          fi
          if [ "${IS_DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(--storage r2 --r2-bucket "$NPB_R2_BUCKET")
          fi
          pnpm --filter @npb/db run update:daily -- "${args[@]}" --include-bis-current | tee data/logs/update-daily-action.log

      - name: Enrich farm game box scores
        id: enrich_farm
        if: ${{ env.IS_DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          current_year=$(TZ=Asia/Tokyo date +%Y)
          args=()
          if [ -n "${{ inputs.date }}" ]; then
            args+=(--from "${{ inputs.date }}" --to "${{ inputs.date }}")
          elif [ -n "${{ inputs.from }}" ] || [ -n "${{ inputs.to }}" ]; then
            args+=(--from "${{ inputs.from }}" --to "${{ inputs.to }}")
          else
            target_days="${{ inputs.days || '3' }}"
            date_to=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
            date_from=$(TZ=Asia/Tokyo date -d "$date_to -$((target_days - 1)) days" +%F)
            args+=(--from "$date_from" --to "$date_to")
          fi
          pnpm --filter @npb/db run enrich:bis-farm-boxes -- \
            --year "$current_year" \
            --sqlite-path "data/npb-${current_year}.sqlite" \
            --delay-ms 300 \
            "${args[@]}" \
            | tee data/logs/enrich-bis-farm-boxes-action.log

      - name: Sync updated SQLite data to D1
        if: ${{ env.IS_DRY_RUN != 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_D1_API_TOKEN GitHub secret is required for D1 sync" >&2
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n ')"
          test "$NPB_D1_DATABASE" = "npb-archive-chat-normalized"
          test "$NPB_D1_DATABASE_ID" = "eb614de3-eb0c-4816-a7b2-8440e94093a8"
          node scripts/phase5-normalized-ops-check.mjs \
            --database "$NPB_D1_DATABASE" \
            --output data/logs/phase5-normalized-ops-check-before-sync.json
          pnpm --filter @npb/db run sync:normalized-d1 -- --sqlite-dir ./data --d1-database "$NPB_D1_DATABASE" --keep-files --verify | tee data/logs/d1-sync-action.log

      - name: Verify D1 sync summary
        if: ${{ env.IS_DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f data/logs/d1-sync-normalized/summary.json

      - name: Backfill official pitching evidence
        if: ${{ env.IS_DRY_RUN != 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_D1_API_TOKEN GitHub secret is required for official pitching evidence backfill" >&2
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n ')"
          node scripts/phase4-backfill-official-pitching-evidence.mjs \
            --output data/logs/phase4-backfill-official-pitching-evidence.json

      - name: Verify normalized D1 integrity after sync
        if: ${{ env.IS_DRY_RUN != 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n ')"
          node scripts/phase5-normalized-ops-check.mjs \
            --database "$NPB_D1_DATABASE" \
            --output data/logs/phase5-normalized-ops-check-after-sync.json

      - name: Save SQLite backups to R2
        if: ${{ always() && env.IS_DRY_RUN != 'true' && steps.update_daily.outcome == 'success' && steps.enrich_farm.outcome == 'success' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "CLOUDFLARE_R2_ACCESS_KEY_ID and CLOUDFLARE_R2_SECRET_ACCESS_KEY GitHub secrets are required for R2 backup save" >&2
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '\r\n ')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '\r\n ')"
          r2_endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for sqlite_path in data/npb-*.sqlite; do
            file_name="$(basename "$sqlite_path")"
            aws s3 cp "$sqlite_path" \
              "s3://${NPB_R2_BUCKET}/${NPB_R2_SQLITE_BACKUP_PREFIX}/${file_name}" \
              --endpoint-url "$r2_endpoint" \
              --content-type application/vnd.sqlite3 \
              --only-show-errors
          done

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Daily NPB Scores Update'
            echo
            echo '- trigger: workflow_dispatch or Cloudflare Cron dispatch'
            echo '- summary: `data/logs/update-daily-summary.json`'
            echo
            if [ -f data/logs/update-daily-summary.json ]; then
              echo '### update:daily'
              echo
              echo '```json'
              cat data/logs/update-daily-summary.json
              echo '```'
            fi
            if [ -f data/logs/d1-sync-normalized/summary.json ]; then
              echo
              echo '### sync:normalized-d1'
              echo
              echo '```json'
              cat data/logs/d1-sync-normalized/summary.json
              echo '```'
            fi
            if [ -f data/logs/phase5-normalized-ops-check-after-sync.json ]; then
              echo
              echo '### phase5 normalized ops check'
              echo
              echo '```json'
              cat data/logs/phase5-normalized-ops-check-after-sync.json
              echo '```'
            fi
            if [ -f data/logs/phase4-backfill-official-pitching-evidence.json ]; then
              echo
              echo '### phase4 official pitching evidence backfill'
              echo
              echo '```json'
              cat data/logs/phase4-backfill-official-pitching-evidence.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-update-logs
          path: |
            data/logs/update-daily-action.log
            data/logs/update-daily-summary.json
            data/logs/update-job.log
            data/logs/enrich-scores-calendar.log
            data/logs/enrich-bis-farm-boxes-action.log
            data/logs/d1-sync-action.log
            data/logs/d1-sync-normalized/summary.json
            data/logs/phase4-backfill-official-pitching-evidence.json
            data/logs/phase5-normalized-ops-check-before-sync.json
            data/logs/phase5-normalized-ops-check-after-sync.json
          if-no-files-found: ignore
