# Cloudflare Workers 向け（雛形）。本番の database_id / bucket はダッシュボードで作成後に置き換える。
# ビルド: リポジトリルートで `pnpm build:cf` → `apps/web/.output` が生成される。
# デプロイ: `cd apps/web && wrangler deploy`（詳細は docs/deploy.md）

name = "npb-archive-chat-web"
main = ".output/server/index.mjs"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# --- D1（正規化検索 DB・チャット usage 用。binding 名はアプリ側で参照する際のキー）---
[[d1_databases]]
binding = "NPB_DB"
database_name = "npb-archive-chat-import"
# ダッシュボードで D1 を作成後、UUID を貼り付け（このままではリモート apply / deploy に失敗する）
database_id = "14c099c3-03ac-4307-9704-7a770b31d108"

# --- R2（raw HTML / rich JSON 等。現行の検索・チャット API はローカル SQLite のみ使用）---
[[r2_buckets]]
binding = "NPB_R2_RAW"
bucket_name = "npb-archive-chat-raw"

# 静的アセットは Nitro の cloudflare_module 出力に合わせて配信（必要に応じて調整）
[assets]
binding = "ASSETS"
directory = ".output/public"
