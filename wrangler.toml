# Cloudflare Workers configuration at the repository root.
#
# Build from the repository root:
#   pnpm build:cf
# Deploy from the repository root:
#   wrangler deploy

name = "npb-archive-chat-web"
main = "apps/web/.output/server/index.mjs"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[vars]
NPB_AUTH_HEADER_FALLBACK = "false"
NPB_DEFAULT_PLAN = "free"
CHAT_QUERY_LLM_BASE_URL = "https://api.openai.com/v1"
CHAT_QUERY_LLM_MODEL = "gpt-4.1-mini"
CHAT_ALLOW_HEURISTIC_FALLBACK = "false"
CHAT_ANSWER_LLM_BASE_URL = "https://api.openai.com/v1"
CHAT_ANSWER_LLM_MODEL = "gpt-4.1-mini"
CHAT_ALLOW_DETERMINISTIC_ANSWER_FALLBACK = "false"

[build]
command = "pnpm build:cf"
cwd = "."
watch_dir = "apps/web"

[alias]
vue = "./apps/web/node_modules/vue/dist/vue.runtime.esm-bundler.js"
"@vue/server-renderer" = "./apps/web/node_modules/@vue/server-renderer/dist/server-renderer.esm-bundler.js"
"@vue/shared" = "./apps/web/node_modules/@vue/shared/dist/shared.esm-bundler.js"

# D1: normalized search DB and chat account/usage DB.
[[d1_databases]]
binding = "NPB_DB"
database_name = "npb-archive-chat-import"
database_id = "14c099c3-03ac-4307-9704-7a770b31d108"

[[d1_databases]]
binding = "NPB_META_DB"
database_name = "npb-archive-chat-meta"
database_id = "585f542f-488d-4196-8f97-373d858302df"

# R2: raw HTML / structured JSON storage scaffold.
[[r2_buckets]]
binding = "NPB_R2_RAW"
bucket_name = "npb-archive-chat-raw"

# Static assets generated by Nitro cloudflare_module build.
[assets]
binding = "ASSETS"
directory = "apps/web/.output/public"

[[routes]]
pattern = "npb-chat.dom9th-works.com"
zone_name = "dom9th-works.com"
custom_domain = true

[triggers]
crons = ["5 1,7,13 * * *"]
